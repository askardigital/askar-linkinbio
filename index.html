<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Askar Studio | Link in Bio</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===================================================
           BACKGROUND LIGHT BEAM & AURORA (PERSIS GAMBAR REFERENCE)
           =================================================== */
        .bg-glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        /* Lengkungan Cahaya Atas (Top Light Lens Beam) */
        .glow-beam-top {
            position: absolute;
            top: -180px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, 
                #ffffff 0%, 
                #38bdf8 20%, 
                #1d4ed8 45%, 
                rgba(30, 58, 138, 0.4) 65%, 
                transparent 80%);
            filter: blur(35px);
            opacity: 0.85;
        }

        /* Garis Kecerahan Ekstra di Tengah Top Beam */
        .glow-core-top {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, #ffffff 0%, #60a5fa 50%, transparent 80%);
            filter: blur(18px);
            opacity: 0.95;
        }

        /* Lengkungan Cahaya Bawah (Bottom Light Beam) */
        .glow-beam-bottom {
            position: absolute;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 750px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, 
                #60a5fa 0%, 
                #2563eb 25%, 
                rgba(15, 23, 42, 0.9) 60%, 
                transparent 80%);
            filter: blur(45px);
            opacity: 0.65;
        }

        /* Ambient Dark Vignette overlay untuk kontras */
        .vignette-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(2, 6, 23, 0.6) 90%);
        }

        /* ===================================================
           MAIN CONTAINER & GLASSMORPHISM CONTENT (iOS STYLE)
           =================================================== */
        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Profile Header */
        .profile-wrapper {
            margin-bottom: 24px;
        }

        /* Frame Logo Glassmorphic */
        .logo-box {
            display: inline-block;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 14px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(56, 189, 248, 0.25);
            margin-bottom: 14px;
            transition: all 0.4s ease;
        }

        .logo-box:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(96, 165, 250, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        0 0 45px rgba(56, 189, 248, 0.4);
        }

        .logo-img {
            max-width: 170px;
            max-height: 55px;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .tagline {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }

        /* Card About Me Frosted Glass iOS */
        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 26px;
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.65;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .glass-card strong {
            color: #ffffff;
        }

        /* Buttons Container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* iOS Glass Buttons */
        .btn-glass {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Efek Kilau Kaca Mengalir (Glossy Flare Sweep) */
        .btn-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.15), 
                transparent
            );
            transition: left 0.7s ease;
        }

        .btn-glass:hover::before {
            left: 120%;
        }

        .btn-glass:hover {
            transform: translateY(-3px) scale(1.01);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* Color Glow Saat Hover Per Platform */
        .btn-wa:hover {
            border-color: rgba(37, 211, 102, 0.6);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-ig:hover {
            border-color: rgba(225, 48, 108, 0.6);
            box-shadow: 0 10px 30px rgba(225, 48, 108, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-tiktok:hover {
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-glass i {
            font-size: 1.25rem;
            transition: transform 0.3s ease;
        }

        .btn-glass:hover i {
            transform: scale(1.15);
        }

        footer {
            margin-top: 40px;
            font-size: 0.78rem;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Background Light Lens Beam (SaaS Glowing Theme) -->
    <div class="bg-glow-container">
        <div class="glow-beam-top"></div>
        <div class="glow-core-top"></div>
        <div class="glow-beam-bottom"></div>
        <div class="vignette-overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Profile & Logo -->
        <div class="profile-wrapper">
            <div class="logo-box">
                <img src="icon.png.png" alt="Askar Studio" class="logo-img" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
                <h1 id="alt-title" style="display:none; font-size: 1.5rem; font-weight:800; color:#fff;">Askar Studio</h1>
            </div>
            <p class="tagline">Graphic Design & Digital Printing</p>
        </div>

        <!-- About Card (iOS Frosted Glass) -->
        <div class="glass-card">
            👋 Halo! Selamat datang di <strong>Askar Studio</strong>. Kami siap melayani kebutuhan <strong>Desain Grafis</strong> profesional (Logo, Branding, UI/UX) dan produk <strong>Digital Printing</strong> berkualitas tinggi.
        </div>

        <!-- Links Menu -->
        <div class="links-container">
            <!-- WhatsApp -->
            <a href="https://wa.me/6283131176148?text=Halo%20Askar%20Studio,%20saya%20mau%20konsultasi%20desain/cetak" target="_blank" class="btn-glass btn-wa">
                <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i>
                <span>Hubungi via WhatsApp</span>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/Askardigital.id" target="_blank" class="btn-glass btn-ig">
                <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
                <span>Instagram</span>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@askardigital.id" target="_blank" class="btn-glass btn-tiktok">
                <i class="fa-brands fa-tiktok" style="color: #00f2fe;"></i>
                <span>TikTok</span>
            </a>
        </div>

        <footer>
            © 2026 Askar Studio. All Rights Reserved.
        </footer>
    </div>

</body>
</html>
